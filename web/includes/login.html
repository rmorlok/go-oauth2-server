{{ define "title" }}Sign in{{ end }}

{{ define "content" }}
<section class="panel auth-panel" aria-labelledby="sign-in-heading">
  <div class="page-heading">
    <p class="eyebrow">Secure access</p>
    <h1 id="sign-in-heading">Welcome back</h1>
    <p>Sign in to continue to the requesting application.</p>
  </div>

  {{ if .error }}
  <div class="alert" role="alert">
    <strong>We couldn't sign you in.</strong>
    <span>{{ .error }}</span>
  </div>
  {{ end }}

  <form class="form-stack" action="" method="post">
    <div class="form-field">
      <label for="inputEmail">Email address</label>
      <input type="email" name="email" id="inputEmail" autocomplete="username" placeholder="you@example.com" required autofocus>
    </div>
    <div class="form-field">
      <label for="inputPassword">Password</label>
      <input type="password" name="password" id="inputPassword" autocomplete="current-password" placeholder="Enter your password" required>
    </div>
    <button class="button button-primary button-block" type="submit">Sign in <span aria-hidden="true">→</span></button>
  </form>

  <p class="auth-switch">New here? <a href="/web/register{{ .queryString }}">Create an account</a></p>
</section>
{{ end }}
